<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Notices - Admin Panel | Bhanja College of Nursing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-page="notices">
  <div class="admin-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><i class="fas fa-staff-snake sidebar-logo"></i><div><span class="sidebar-title">BCN Admin</span><span class="sidebar-sub">CMS Panel</span></div></div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="notices.html" class="sidebar-link active"><i class="fas fa-bullhorn"></i> Notices</a>
        <a href="gallery.html" class="sidebar-link"><i class="fas fa-images"></i> Gallery</a>
        <a href="leads.html" class="sidebar-link"><i class="fas fa-users"></i> Enquiry Leads</a>
        <div class="sidebar-divider"></div>
        <a href="../index.html" class="sidebar-link"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="#" class="sidebar-link btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h2>Manage Notices</h2>
        <div class="topbar-right">
          <button class="btn-admin-primary" id="addNoticeBtn"><i class="fas fa-plus"></i> Add New Notice</button>
        </div>
      </header>
      <div class="admin-content">
        <div class="table-container">
          <table class="admin-table">
            <thead><tr><th>#</th><th>Title</th><th>Date</th><th>Ticker</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="noticeTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Notice Form Modal -->
  <div class="admin-modal-overlay" id="noticeModal">
    <div class="admin-modal">
      <div class="admin-modal-header">
        <h3 id="noticeFormTitle">Add New Notice</h3>
        <button class="admin-modal-close modal-close">&times;</button>
      </div>
      <div style="padding:24px;">
        <div class="form-group-admin"><label>Title *</label><input type="text" class="form-input-admin" id="noticeTitle" placeholder="Notice title"></div>
        <div class="form-group-admin"><label>Body</label><textarea class="form-input-admin" id="noticeBody" rows="4" placeholder="Notice body text"></textarea></div>
        <div class="form-group-admin"><label>PDF URL (optional)</label><input type="text" class="form-input-admin" id="noticePdf" placeholder="Link to PDF"></div>
        <div class="form-row-admin">
          <label class="toggle-label"><input type="checkbox" id="noticeTicker"> Show on Ticker</label>
          <label class="toggle-label"><input type="checkbox" id="noticeIsNew" checked> Mark as New</label>
        </div>
        <div class="form-actions-admin">
          <button type="button" class="btn-admin-secondary modal-close">Cancel</button>
          <button type="button" class="btn-admin-primary" id="saveNoticeBtn">Save Notice</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div class="admin-modal-overlay" id="confirmModal">
    <div class="admin-modal" style="max-width:400px;text-align:center;">
      <div class="admin-modal-header"><h3>Confirm</h3><button class="admin-modal-close modal-close">&times;</button></div>
      <p class="confirm-msg" style="padding:20px;color:#6C757D;">Are you sure?</p>
      <div class="form-actions-admin" style="padding:0 24px 24px;">
        <button class="btn-admin-secondary btn-confirm-no">Cancel</button>
        <button class="btn-admin-danger btn-confirm-yes">Confirm</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
