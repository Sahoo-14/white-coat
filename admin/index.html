<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Bhanja College of Nursing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0D1B2A 0%, #1B2A4A 50%, #2A9D8F 100%); font-family: 'Inter', -apple-system, sans-serif; }
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap');
    .login-container { background: #fff; border-radius: 16px; padding: 48px 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
    .login-logo { font-size: 3rem; color: #C9A84C; margin-bottom: 8px; }
    .login-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #1B2A4A; margin-bottom: 4px; }
    .login-subtitle { color: #6C757D; font-size: 0.88rem; margin-bottom: 32px; }
    .form-group { margin-bottom: 20px; text-align: left; }
    .form-label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.88rem; color: #1B2A4A; }
    .form-input { width: 100%; padding: 12px 16px; border: 2px solid #E9ECEF; border-radius: 8px; font-size: 0.95rem; font-family: inherit; outline: none; transition: all 0.3s ease; box-sizing: border-box; }
    .form-input:focus { border-color: #C9A84C; box-shadow: 0 0 0 3px rgba(201,168,76,0.15); }
    .login-btn { width: 100%; padding: 14px; background: #C9A84C; color: #0D1B2A; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
    .login-btn:hover { background: #D4BC6A; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(201,168,76,0.4); }
    .login-btn:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .error-msg { color: #DC3545; font-size: 0.85rem; margin-top: 16px; display: none; padding: 10px; background: rgba(220,53,69,0.08); border-radius: 6px; }
    .error-msg.visible { display: block; }
    .lockout-msg { color: #FFC107; font-size: 0.85rem; margin-top: 12px; display: none; padding: 10px; background: rgba(255,193,7,0.1); border-radius: 6px; }
    .lockout-msg.visible { display: block; }
    .login-hint { margin-top: 24px; padding: 14px; background: #F8F9FA; border-radius: 8px; font-size: 0.8rem; color: #6C757D; }
    .login-hint strong { color: #1B2A4A; }
    .back-link { margin-top: 20px; display: inline-block; color: #6C757D; text-decoration: none; font-size: 0.85rem; transition: color 0.3s; }
    .back-link:hover { color: #C9A84C; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo"><i class="fas fa-staff-snake"></i></div>
    <h1 class="login-title">Admin Portal</h1>
    <p class="login-subtitle">Bhanja College of Nursing — CMS</p>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username"><i class="fas fa-user"></i> Username</label>
        <input type="text" class="form-input" id="username" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password"><i class="fas fa-lock"></i> Password</label>
        <input type="password" class="form-input" id="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
      <div class="error-msg" id="errorMsg"></div>
      <div class="lockout-msg" id="lockoutMsg"></div>
    </form>

    <div class="login-hint">
      <strong>Demo Credentials:</strong><br>
      Username: <strong>admin</strong> &nbsp;|&nbsp; Password: <strong>bhanja2026</strong>
    </div>

    <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Website</a>
  </div>

  <script>
    const VALID_USER = 'admin';
    const VALID_PASS = 'bhanja2026';
    const MAX_ATTEMPTS = 3;
    const LOCKOUT_MS = 5 * 60 * 1000;

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const lockoutMsg = document.getElementById('lockoutMsg');
    const loginBtn = document.getElementById('loginBtn');

    function getAttempts() {
      try { return JSON.parse(localStorage.getItem('bcn_login_attempts')) || { count: 0, lockoutUntil: null }; }
      catch { return { count: 0, lockoutUntil: null }; }
    }

    function saveAttempts(a) { localStorage.setItem('bcn_login_attempts', JSON.stringify(a)); }

    function checkLockout() {
      const a = getAttempts();
      if (a.lockoutUntil && Date.now() < a.lockoutUntil) {
        const remaining = Math.ceil((a.lockoutUntil - Date.now()) / 1000);
        const mins = Math.floor(remaining / 60);
        const secs = remaining % 60;
        lockoutMsg.textContent = `Account locked. Try again in ${mins}m ${secs}s`;
        lockoutMsg.classList.add('visible');
        loginBtn.disabled = true;
        return true;
      } else if (a.lockoutUntil && Date.now() >= a.lockoutUntil) {
        saveAttempts({ count: 0, lockoutUntil: null });
        lockoutMsg.classList.remove('visible');
        loginBtn.disabled = false;
      }
      return false;
    }

    // Check on load
    if (sessionStorage.getItem('bcn_admin_session')) {
      window.location.href = 'dashboard.html';
    }
    checkLockout();
    setInterval(checkLockout, 1000);

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (checkLockout()) return;

      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      if (user === VALID_USER && pass === VALID_PASS) {
        sessionStorage.setItem('bcn_admin_session', 'active_' + Date.now());
        saveAttempts({ count: 0, lockoutUntil: null });
        window.location.href = 'dashboard.html';
      } else {
        const a = getAttempts();
        a.count++;
        if (a.count >= MAX_ATTEMPTS) {
          a.lockoutUntil = Date.now() + LOCKOUT_MS;
          errorMsg.textContent = 'Too many failed attempts. Account locked for 5 minutes.';
        } else {
          errorMsg.textContent = `Invalid credentials. ${MAX_ATTEMPTS - a.count} attempt(s) remaining.`;
        }
        errorMsg.classList.add('visible');
        saveAttempts(a);
        checkLockout();
      }
    });
  </script>
</body>
</html>
