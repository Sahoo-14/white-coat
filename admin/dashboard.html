<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Admin Panel | Bhanja College of Nursing</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body data-page="dashboard">
  <div class="admin-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <i class="fas fa-staff-snake sidebar-logo"></i>
        <div><span class="sidebar-title">BCN Admin</span><span class="sidebar-sub">CMS Panel</span></div>
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        <a href="notices.html" class="sidebar-link"><i class="fas fa-bullhorn"></i> Notices</a>
        <a href="gallery.html" class="sidebar-link"><i class="fas fa-images"></i> Gallery</a>
        <a href="leads.html" class="sidebar-link"><i class="fas fa-users"></i> Enquiry Leads</a>
        <div class="sidebar-divider"></div>
        <a href="../index.html" class="sidebar-link"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="#" class="sidebar-link btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
      </nav>
    </aside>

    <!-- Main Content -->
    <div class="admin-main">
      <header class="admin-topbar">
        <button class="sidebar-toggle" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h2>Dashboard</h2>
        <div class="topbar-right">
          <span class="topbar-welcome">Welcome, <strong>Admin</strong></span>
          <button class="btn-sm-admin btn-logout"><i class="fas fa-sign-out-alt"></i></button>
        </div>
      </header>

      <div class="admin-content">
        <!-- Stat Cards -->
        <div class="stat-cards" id="statCards">
          <div class="stat-card" style="border-top:4px solid #1B2A4A;">
            <div class="stat-card-icon" style="background:rgba(27,42,74,0.1);color:#1B2A4A;"><i class="fas fa-bullhorn"></i></div>
            <div class="stat-card-info"><span class="stat-card-number" id="statNotices">0</span><span class="stat-card-label">Total Notices</span></div>
          </div>
          <div class="stat-card" style="border-top:4px solid #C9A84C;">
            <div class="stat-card-icon" style="background:rgba(201,168,76,0.1);color:#C9A84C;"><i class="fas fa-images"></i></div>
            <div class="stat-card-info"><span class="stat-card-number" id="statGallery">0</span><span class="stat-card-label">Gallery Items</span></div>
          </div>
          <div class="stat-card" style="border-top:4px solid #2A9D8F;">
            <div class="stat-card-icon" style="background:rgba(42,157,143,0.1);color:#2A9D8F;"><i class="fas fa-users"></i></div>
            <div class="stat-card-info"><span class="stat-card-number" id="statLeads">0</span><span class="stat-card-label">Total Enquiries</span></div>
          </div>
          <div class="stat-card" style="border-top:4px solid #28A745;">
            <div class="stat-card-icon" style="background:rgba(40,167,69,0.1);color:#28A745;"><i class="fas fa-user-plus"></i></div>
            <div class="stat-card-info"><span class="stat-card-number" id="statTodayLeads">0</span><span class="stat-card-label">New Today</span></div>
          </div>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
          <h3><i class="fas fa-bolt"></i> Quick Actions</h3>
          <div class="quick-action-btns">
            <a href="notices.html" class="quick-action-btn" id="quickAddNotice"><i class="fas fa-plus-circle"></i> Add Notice</a>
            <a href="gallery.html" class="quick-action-btn" id="quickAddImage"><i class="fas fa-image"></i> Add Image</a>
            <a href="leads.html" class="quick-action-btn" id="quickExportLeads"><i class="fas fa-file-export"></i> Export Leads</a>
          </div>
        </div>

        <div class="dashboard-grid">
          <!-- Recent Notices -->
          <div class="dashboard-card">
            <div class="dashboard-card-header">
              <h3><i class="fas fa-bullhorn"></i> Recent Notices</h3>
              <a href="notices.html">View All →</a>
            </div>
            <div class="dashboard-card-body" id="recentNotices">
              <p class="empty-state">Loading...</p>
            </div>
          </div>

          <!-- Recent Enquiries -->
          <div class="dashboard-card">
            <div class="dashboard-card-header">
              <h3><i class="fas fa-users"></i> Recent Enquiries</h3>
              <a href="leads.html">View All →</a>
            </div>
            <div class="dashboard-card-body" id="recentLeads">
              <p class="empty-state">Loading...</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
